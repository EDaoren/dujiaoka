services:
  web:
    build: .
    container_name: dujiaoka
    ports:
      - "8111:80"
    volumes:
      - ./data/uploads:/app/public/uploads
    environment:
      # Web 服务器配置
      WEB_DOCUMENT_ROOT: "/app/public"
      TZ: Asia/Shanghai

      # 应用配置
      APP_NAME: "独角数卡"
      APP_URL: "http://localhost:8111"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_HTTPS: "false"

      # 数据库配置（请修改为你的外部数据库信息）
      DB_HOST: "your_mysql_host"
      DB_PORT: "3306"
      DB_DATABASE: "dujiaoka"
      DB_USERNAME: "your_mysql_user"
      DB_PASSWORD: "your_mysql_password"

      # Redis 配置（请修改为你的外部 Redis 信息）
      REDIS_HOST: "your_redis_host"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""

      # 后台配置
      ADMIN_ROUTE_PREFIX: "admin"
      ADMIN_LANGUAGE: "zh_CN"

    tty: true
    restart: always
    networks:
      - dujiaoka

networks:
  dujiaoka:
    driver: bridge
